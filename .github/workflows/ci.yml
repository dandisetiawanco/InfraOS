name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go Format, Vet, Race Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Check gofmt
        run: |
          test -z "$(gofmt -l cmd internal pkg)"
      - name: Run go vet
        run: go vet ./...
      - name: Run Go unit and integration tests with race detector
        run: go test -race -count=1 ./...
      - name: Build API, agent, and worker binaries
        run: |
          go build ./cmd/api
          go build ./cmd/agent
          go build ./cmd/worker
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  postgres-migrations:
    name: PostgreSQL Migration & Compatibility Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: infraos_test
          POSTGRES_USER: infraos
          POSTGRES_PASSWORD: infraos_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Run PostgreSQL migration and seed check
        env:
          INFRAOS_DB_DRIVER: postgres
          INFRAOS_POSTGRES_DSN: postgres://infraos:infraos_test_password@127.0.0.1:5432/infraos_test?sslmode=disable
        run: go run ./cmd/api --seed-demo-only

  frontend:
    name: Next.js Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @infraos/web lint
      - name: TypeScript typecheck
        run: pnpm --filter @infraos/web typecheck
      - name: Unit tests
        run: pnpm --filter @infraos/web test
      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8080
        run: pnpm --filter @infraos/web build

  docker:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Go service images (no push)
        run: |
          docker build -f infrastructure/docker/api.Dockerfile -t infraos-api:ci .
          docker build -f infrastructure/docker/worker.Dockerfile -t infraos-worker:ci .
          docker build -f infrastructure/docker/agent.Dockerfile -t infraos-agent:ci .
          docker build -f infrastructure/docker/sample-app/Dockerfile -t infraos-sample:ci .

  terraform:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Check formatting
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive
      - name: Validate configuration
        working-directory: infrastructure/terraform
        run: |
          terraform init -backend=false
          terraform validate

  security-scan:
    name: Secret Pattern Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files for forbidden secret patterns
        run: |
          ! git grep -nE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16})' -- ':!.github/workflows/ci.yml' ':!internal/security/security_test.go'
