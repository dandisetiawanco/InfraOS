<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340" fill="none">
  <rect width="920" height="340" rx="16" fill="#F3F6F8"/>
  <text x="32" y="42" fill="#172A32" font-family="system-ui, sans-serif" font-size="19" font-weight="700">Agent Enrollment and Authentication Flow</text>
  <text x="32" y="64" fill="#586971" font-family="system-ui, sans-serif" font-size="12">Single-use expiring enrollment tokens exchanged for per-agent SHA-256 hashed credentials</text>
  <defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L10 5L0 9Z" fill="#237C83"/></marker></defs>

  <rect x="32" y="96" width="180" height="204" rx="12" fill="#FFFFFF" stroke="#172A32" stroke-opacity="0.2"/>
  <text x="48" y="124" fill="#172A32" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Admin User</text>
  <text x="48" y="146" fill="#586971" font-family="system-ui, sans-serif" font-size="12">Authenticated session</text>
  <text x="48" y="164" fill="#586971" font-family="system-ui, sans-serif" font-size="12">Owner or Admin role</text>

  <rect x="360" y="96" width="200" height="204" rx="12" fill="#FFFFFF" stroke="#237C83" stroke-width="1.8"/>
  <text x="376" y="124" fill="#172A32" font-family="system-ui, sans-serif" font-size="14" font-weight="700">InfraOS Control Plane</text>
  <text x="376" y="148" fill="#586971" font-family="monospace" font-size="11">SHA-256 token store</text>
  <text x="376" y="168" fill="#586971" font-family="monospace" font-size="11">Atomic used_at mark</text>
  <text x="376" y="188" fill="#586971" font-family="monospace" font-size="11">Rotate / Revoke API</text>
  <text x="376" y="208" fill="#586971" font-family="monospace" font-size="11">Audit trail persisted</text>

  <rect x="708" y="96" width="180" height="204" rx="12" fill="#FFFFFF" stroke="#172A32" stroke-opacity="0.2"/>
  <text x="724" y="124" fill="#172A32" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Go Host Agent</text>
  <text x="724" y="146" fill="#586971" font-family="system-ui, sans-serif" font-size="12">0600 credentials file</text>
  <text x="724" y="164" fill="#586971" font-family="system-ui, sans-serif" font-size="12">Authorization: Agent</text>

  <line x1="212" y1="142" x2="354" y2="142" stroke="#237C83" stroke-width="2" marker-end="url(#a2)"/>
  <text x="220" y="134" fill="#172A32" font-family="monospace" font-size="10">1. Issue token (30m)</text>

  <line x1="708" y1="196" x2="566" y2="196" stroke="#237C83" stroke-width="2" marker-end="url(#a2)"/>
  <text x="572" y="188" fill="#172A32" font-family="monospace" font-size="10">2. POST /agents/enroll</text>

  <line x1="560" y1="234" x2="702" y2="234" stroke="#237C83" stroke-width="2" marker-end="url(#a2)"/>
  <text x="572" y="226" fill="#172A32" font-family="monospace" font-size="10">3. Return agent_token</text>

  <line x1="708" y1="274" x2="566" y2="274" stroke="#237C83" stroke-width="2" marker-end="url(#a2)"/>
  <text x="572" y="266" fill="#172A32" font-family="monospace" font-size="10">4. POST /agents/metrics</text>
</svg>
