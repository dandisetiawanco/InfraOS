  <text x="32" y="64" fill="#586971" font-family="system-ui, sans-serif" font-size="12">Atomic SQL target lock prevents conflicting rollouts; rollback requires verified previous artifact</text>
  <defs><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L10 5L0 9Z" fill="#237C83"/></marker></defs>
  <g font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">
