    <rect x="796" y="132" width="96" height="38" rx="9" fill="#FCE8E8" stroke="#991B1B"/>
    <text x="844" y="155" fill="#991B1B" font-size="11">FAILED</text>
  </g>
  <line x1="144" y1="126" x2="172" y2="126" stroke="#237C83" stroke-width="2" marker-end="url(#a5)"/>
