  <text x="470" y="222" text-anchor="middle" fill="#172A32" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Authorized Rollback -> Lock Target -> Restore Previous Artifact -> Verify Health -> ROLLED_BACK -> Release Lock</text>
