<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="920" height="320" fill="none">
  <rect width="920" height="320" rx="16" fill="#F3F6F8"/>
  <text x="32" y="42" fill="#172A32" font-family="system-ui, sans-serif" font-size="19" font-weight="700">Security and Isolation Boundaries</text>
  <rect x="32" y="76" width="266" height="210" rx="12" fill="#FFFFFF" stroke="#991B1B" stroke-width="1.5"/>
  <text x="48" y="104" fill="#991B1B" font-family="monospace" font-size="11" font-weight="700">UNTRUSTED / PUBLIC ZONE</text>
  <text x="48" y="128" fill="#172A32" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Public Demo &amp; External Inputs</text>
  <text x="48" y="152" fill="#586971" font-family="system-ui, sans-serif" font-size="12">• Isolated synthetic demo orgs</text>
  <text x="48" y="172" fill="#586971" font-family="system-ui, sans-serif" font-size="12">• Blocked from host &amp; Docker</text>
  <text x="48" y="192" fill="#586971" font-family="system-ui, sans-serif" font-size="12">• Blocked from live probes</text>
  <text x="48" y="212" fill="#586971" font-family="system-ui, sans-serif" font-size="12">• Rate-limited login endpoint</text>
  <text x="48" y="232" fill="#586971" font-family="system-ui, sans-serif" font-size="12">• HMAC-SHA256 webhook verify</text>

  <rect x="326" y="76" width="268" height="210" rx="12" fill="#FFFFFF" stroke="#237C83" stroke-width="1.8"/>
  <text x="342" y="104" fill="#237C83" font-family="monospace" font-size="11" font-weight="700">CONTROL PLANE ENFORCEMENT</text>
  <text x="342" y="128" fill="#172A32" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Server-Side Authorization</text>
  <text x="342" y="152" fill="#586971" font-family="system-ui, sans-serif" font-size="12">• Argon2id + HttpOnly + CSRF</text>
  <text x="342" y="172" fill="#586971" font-family="system-ui, sans-serif" font-size="12">• Org-scoped SQL queries</text>
  <text x="342" y="192" fill="#586971" font-family="system-ui, sans-serif" font-size="12">• RBAC: Owner/Admin/Op/Viewer</text>
  <text x="342" y="212" fill="#586971" font-family="system-ui, sans-serif" font-size="12">• SSRF DNS &amp; Redirect Validator</text>
  <text x="342" y="232" fill="#586971" font-family="system-ui, sans-serif" font-size="12">• Log &amp; AI Secret Redaction</text>

  <rect x="622" y="76" width="266" height="210" rx="12" fill="#FFFFFF" stroke="#166534" stroke-width="1.5"/>
  <text x="638" y="104" fill="#166534" font-family="monospace" font-size="11" font-weight="700">TRUSTED INFRASTRUCTURE</text>
  <text x="638" y="128" fill="#172A32" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Authorized Hosts &amp; Stores</text>
  <text x="638" y="152" fill="#586971" font-family="system-ui, sans-serif" font-size="12">• Separate per-agent credentials</text>
  <text x="638" y="172" fill="#586971" font-family="system-ui, sans-serif" font-size="12">• Non-root OS metrics collection</text>
  <text x="638" y="192" fill="#586971" font-family="system-ui, sans-serif" font-size="12">• No arbitrary shell exec API</text>
  <text x="638" y="212" fill="#586971" font-family="system-ui, sans-serif" font-size="12">• Private DB/Redis Docker net</text>
  <text x="638" y="232" fill="#586971" font-family="system-ui, sans-serif" font-size="12">• AES-256-GCM integration keys</text>
</svg>
