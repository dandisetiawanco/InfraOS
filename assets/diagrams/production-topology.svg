<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" fill="none">
  <rect width="940" height="340" rx="16" fill="#F3F6F8"/>
  <text x="32" y="42" fill="#172A32" font-family="system-ui, sans-serif" font-size="19" font-weight="700">Production Linux Deployment Topology</text>
  <text x="32" y="64" fill="#586971" font-family="system-ui, sans-serif" font-size="12">Only ports 80/443 (and CIDR-restricted SSH 22) exposed publicly; PostgreSQL and Redis isolated on private network</text>
