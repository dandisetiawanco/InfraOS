  <text x="48" y="162" fill="#586971" font-family="monospace" font-size="11">HTTPS :443</text>
  <text x="48" y="182" fill="#586971" font-family="system-ui, sans-serif" font-size="11">Operators (Browser)</text>
  <text x="48" y="200" fill="#586971" font-family="system-ui, sans-serif" font-size="11">Linux systemd Agents</text>
  <text x="48" y="218" fill="#586971" font-family="system-ui, sans-serif" font-size="11">GitHub Webhooks</text>

  <rect x="224" y="110" width="170" height="140" rx="12" fill="#FFFFFF" stroke="#237C83" stroke-width="1.8"/>
  <text x="240" y="138" fill="#172A32" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Nginx TLS Edge</text>
  <text x="240" y="160" fill="#586971" font-family="system-ui, sans-serif" font-size="11">TLS 1.2/1.3 Termination</text>
  <text x="240" y="178" fill="#586971" font-family="system-ui, sans-serif" font-size="11">SSE Buffering Off</text>
  <text x="240" y="196" fill="#586971" font-family="system-ui, sans-serif" font-size="11">Rate &amp; Body Limits</text>
  <text x="240" y="214" fill="#586971" font-family="system-ui, sans-serif" font-size="11">Private /metrics ACL</text>

