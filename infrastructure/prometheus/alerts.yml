groups:
  - name: infraos_control_plane
    rules:
      - alert: InfraOSAPIDown
        expr: up{job="infraos_api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: InfraOS API scrape target is unreachable
          description: Prometheus failed to scrape infraos_api for more than 1 minute.

      - alert: InfraOSHigh5xxErrorRate
        expr: |
          sum(rate(infraos_http_errors_total[5m]))
          /
          clamp_min(sum(rate(infraos_http_requests_total[5m])), 1) > 0.05
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: Elevated HTTP 5xx error ratio on InfraOS API
          description: More than 5% of API requests returned HTTP 5xx over the past 5 minutes.

      - alert: InfraOSHighAPILatencyP95
        expr: histogram_quantile(0.95, sum(rate(infraos_http_request_duration_seconds_bucket[5m])) by (le)) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: InfraOS API p95 latency exceeded 1 second
          description: Request duration p95 stayed above 1.0s for 5 minutes.

      - alert: InfraOSDatabaseErrorsDetected
        expr: increase(infraos_database_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: InfraOS database operation errors detected
          description: One or more database queries failed within the past 5 minutes.

      - alert: InfraOSDeploymentQueueBacklog
        expr: infraos_deployment_queue_size > 25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: InfraOS background job queue backlog growing
          description: More than 25 background jobs remained queued for 5 minutes.
